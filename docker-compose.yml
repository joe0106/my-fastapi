services:
  postgresql_db:
    image: postgres:15.1
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    expose:
      - 5432
    env_file:
      - db.postgresql.env
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fastapi_tutorial", "-d", "fastapi_tutorial"]
      interval: 5s
      timeout: 5s
      retries: 5
  mysql_db:
    image: mysql:8.1
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql/
    expose:
      - 3306
    env_file:
      - db.mysql.env
    healthcheck:
      test: ["CMD", "echo" , ">/dev/tcp/localhost/3306"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build: .
    volumes:
      - .:/usr/backend/
    command: python3 run.py --prod
    restart: always
    ports:
      - 8000:8003
    depends_on:
      - postgresql_db
      - mysql_db
networks:
  default:
    name: fastapi_tutorial_network
volumes:
  postgres_data:
  mysql_data: